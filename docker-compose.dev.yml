version: '3.8'
services:
  db:
    image: 151885604979.dkr.ecr.us-east-1.amazonaws.com/cybiricalubuntu_postgis:17.7
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      PG_UPGRADE_MODE: true

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d mydb" ]
      interval: 5s
      timeout: 5s
      retries: 10
    # Resource limits matching AWS RDS t3.micro instance
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
  redis:
    image: 151885604979.dkr.ecr.us-east-1.amazonaws.com/cybiricalubuntu_redis:7.4.7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  web:
    build:
      context: ./app
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    command: /bin/sh -c "python /app/manage.py migrate && python /app/manage.py runserver 0.0.0.0:80"
    volumes:
      - ./app:/app
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings
      - DJANGO_DB_HOST=db
      - DJANGO_DB_NAME=mydb
      - DJANGO_DB_USER=myuser
      - DJANGO_DB_PASSWORD=mypassword
      - REDIS_HOST=redis
      - LAMBDA_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - "5173"
    environment:
      - VITE_API_URL=http://localhost/api
    depends_on:
      - web
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - frontend
  # localstack:
  #   image: localstack/localstack:latest
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     - SERVICES=lambda
  #     - DEBUG=1
  #     - LAMBDA_EXECUTOR=docker
  #     - DOCKER_HOST=unix:///var/run/docker.sock
  #   volumes:
  #     - "/var/run/docker.sock:/var/run/docker.sock"
  #     - "./lambda-functions:/etc/localstack/init/ready.d"

volumes:
  postgres_data:
  redis_data:
