{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power-View</title>
  <script>
    function showMuiToast(message) {
      let toast = document.createElement('div');
      toast.textContent = message;
      toast.style.position = 'fixed';
      toast.style.bottom = '32px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%)';
      toast.style.background = '#43a047'; // MUI green[600]
      toast.style.color = '#fff';
      toast.style.padding = '8px 24px';
      toast.style.borderRadius = '4px';
      toast.style.fontSize = '0.95em';
      toast.style.fontFamily = 'Roboto, Arial, sans-serif';
      toast.style.boxShadow = '0 2px 8px rgba(0,0,0,0.18)';
      toast.style.zIndex = 10000;
      toast.style.opacity = 0;
      toast.style.transition = 'opacity 0.2s';
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = 1; }, 10);
      setTimeout(() => { toast.style.opacity = 0; setTimeout(() => toast.remove(), 200); }, 1800);
    }
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (const element of cookies) {
          const cookie = element.trim();
          if (cookie.substring(0, name.length + 1) === name + "=") {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
  </script>
  <style>
    html {
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Roboto, Arial, sans-serif;
      background: #f7f7f7;
      background: #003162;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
    }

    .logo-center {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      width: 100%;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    /* Collapsible card body logic */
    /* MUI-like Card and Collapsible Styles */
    .mui-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
      margin: 1.5em 0;
      padding: 0;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .error-msg-display {
      left: 50% !important;
      transform: translateX(-50%);
      text-align: center;
      width: 100%;
      position: absolute;
      color: red;
      padding-top: 42px;
      display: none;
    }

    .mui-card-collapsed .mui-card-body {
      max-height: 0 !important;
      transition: max-height 0.4s cubic-bezier(.4, 0, .2, 1)
    }

    .mui-card .mui-card-body {
      max-height: 350px;
      visibility: visible;
      pointer-events: auto;
      transition: max-height 0.4s cubic-bezier(.4, 0, .2, 1)
    }

    .mui-card-body-content {
      padding: 1.5em 1.5em 1.2em 1.5em;
    }

    .mui-card:not(.mui-card-collapsed) .mui-card-header {
      padding-bottom: 0 !important;
    }

    .mui-card-collapsed .mui-card-header {
      padding-bottom: 1.1em !important;
    }

    .mui-card:not(.mui-card-collapsed) .mui-card-body-content {
      padding-top: 0;
    }

    .mui-card-header {
      transition: padding-bottom 0.2s;
      font-weight: 600;
      font-size: 1.08em;
      padding: 1.1em 1.5em 1.1em 1.5em;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mui-card-body {
      background: #fff;
      animation: fadeIn 0.2s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .mui-card-collapsible {
      border: none;
      box-shadow: none;
      margin: 0;
      padding: 0;
    }

    .mui-card-collapsible .mui-card-header {
      border-bottom: 1px solid #e0e0e0;
    }

    .mui-card-collapsible .mui-card-header.active {
      border-bottom: none;
    }

    /* Remove display: none/block for smooth transition */
    .mui-tooltip-btn {
      position: relative;
      outline: none;
      z-index: 20;
      background: transparent;
    }

    .mui-tooltip {
      visibility: hidden;
      opacity: 0;
      min-width: 60px;
      background: #616161;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.68em;
      line-height: 1.2;
      position: absolute;
      z-index: 9999;
      left: 100%;
      top: 50%;
      bottom: auto;
      transform: translateY(-50%) translateX(8px);
      transition: opacity 0.2s;
      pointer-events: auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      white-space: nowrap;
    }

    .mui-tooltip-btn:hover .mui-tooltip,
    .mui-tooltip-btn:focus .mui-tooltip {
      visibility: visible;
      opacity: 1;
      left: 100%;
      top: 50%;
      bottom: auto;
      transform: translateY(-50%) translateX(8px);
    }



    .error {
      color: #c00;
      text-align: center;
      margin-top: 1em;
    }

    .mui-btn-contained {
      color: #fff;
      background: #003162;
      border: none;
      border-radius: 4px;
      padding: 6px 16px;
      font-size: 0.95em;
      font-weight: 500;
      text-transform: uppercase;
      box-shadow: 0 2px 4px rgba(25, 118, 210, 0.15);
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .mui-btn-contained:hover,
    .mui-btn-contained:focus {
      background: #002349;
      box-shadow: 0 4px 8px rgba(0, 49, 98, 0.18);
    }

    .mui-btn-contained:active {
      background: #00162a;
      box-shadow: 0 2px 4px rgba(0, 49, 98, 0.15);
    }

    .mui-input-wrapper {
      position: relative;
      margin-bottom: 1.5em;
    }

    .mui-fullwidth {
      width: 100%;
    }

    .mui-input-contained {
      padding: 12px 12px 8px 12px;
      font-size: 1em;
      border: 1px solid #bdbdbd;
      border-radius: 4px;
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 1em;
      display: block;
    }

    /* Floating label styles for MUI-like input */
    .mui-input-label {
      position: absolute;
      left: 12px;
      top: -4px;
      color: #757575;
      font-size: 0.92em;
      pointer-events: none;
      background: rgba(255, 255, 255, 1);
      padding: 0 4px;
      transition: 0.2s cubic-bezier(.4, 0, .2, 1);
      z-index: 2;
      border-radius: 3px;
    }

    label {
      display: block;
      margin-bottom: 0.25em;
      margin-top: 1.25em;
      color: #5a5a5a;
      font-size: 0.85em;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.85;
      padding-left: 0.5em;
      text-align: left;
    }

    .mui-input-contained:focus {
      border-color: #003162;
      box-shadow: 0 0 0 2px rgba(0, 49, 98, 0.08);
    }

    .mui-input-contained:hover {
      border-color: #1976d2;
    }

    /* Label floats up when input is focused or not empty (not :placeholder-shown) */
    .mui-input-contained:not(:placeholder-shown)+.mui-input-label,
    .mui-input-contained:focus+.mui-input-label {
      top: -22px;
      left: 8px;
      font-size: 0.78em;
      color: #003162;
      border-radius: 3px;
      z-index: 3;
      box-shadow: 0 -1px 0 0 #fff, -1px 0 0 0 #fff, -1px 0 0 0 #fff;
      margin-left: -1px;
      opacity: 1;
      margin-right: 4px;
    }

    .mui-typography-h5 {
      font-size: 1.25em;
      font-weight: 500;
      margin-bottom: 1em;
    }
  </style>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  {% block header %}{% endblock %}
</head>

<body>
  <div class="container">
    <div class="logo-center">
      <img src="{% static 'Power-ViewLogo.png' %}" alt="Power-View Logo" />
    </div>
    {% block content %}{% endblock %}
  </div>
  {% include "base_templates/auth_footer.html" %}
</body>

</html>
