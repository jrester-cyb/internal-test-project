{% extends "base_templates/base.html" %}

{% block content %}
<div class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
  <div class="mui-card" style="width:100%; margin: 0 auto 1.5em auto;">
    <div class="mui-card-body">
      <div class="mui-card-body-content">
        <div style="text-align: center;">
          <h5 class="mui-typography-h5">Login</h5>
          <form method="post" style="text-align: center;">
            <div
              style="display: flex; justify-content: center; flex-direction: column; margin-top: 1.5em; position: relative;">
              {% csrf_token %}
              <div class="mui-input-wrapper" style="display: flex; flex-direction: column; margin-bottom: 0;">
                <input type="email" id="email" name="email" class="mui-input-contained"
                  style="display: flex; flex-direction: column;" required placeholder=" " readonly
                  value="{{ email|default:'' }}" />
                <label for="email" class="mui-input-label">Email Address</label>
              </div>
              <div class="mui-input-wrapper" style="display: flex; flex-direction: column; margin-bottom: 0;">
                <input class="mui-input-contained" type="password" id="password" name="password" placeholder=" " value="{{ password|default:'' }}"
                  required autofocus />
                <label for="password" class="mui-input-label">Password</label>
              </div>
              <input type="hidden" name="submit-password" value="true" />
              <div id="api-error" style="color: red; margin-bottom: 4px;">
                {{ error_message }}
              </div>
              <button type="submit" class="mui-btn-contained"
                style="max-width: 280px; width: 100%; margin: 0 auto;">Login</button>
              <div style="text-align:center; margin-top:1em;">
                <a href="{% url 'auth-manager:forgotten-password' %}"
                  style="color:#003162; text-decoration:underline; font-size:0.95em;">Forgot my password?</a>
              </div>
              <div style="text-align:center; margin-bottom:1em;">
                <a href="{% url 'auth-manager:login' %}" style="color:#003162; text-decoration:underline; font-size:0.95em;">Login
                  with a different user</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
