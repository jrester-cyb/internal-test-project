{% extends "base_templates/base.html" %}
{% block header %}
<style>
  .login-container {
    background: #fff;
    padding: 4px 12px 24px;
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
    min-width: 320px;
    max-width: 600px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
{% endblock %}

{% block content %}
<div class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
  <div class="mui-card" style="width:100%; margin: 0 auto 1.5em auto;">
    <div class="mui-card-body">
      <div class="mui-card-body-content">
        <div style="text-align: center;">
          <h5 class="mui-typography-h5">Login</h5>
          <form method="post" onsubmit="handleSubmit(event)" style="text-align: center;">
            <div
              style="display: flex; justify-content: center; flex-direction: column; margin-top: 1.5em; position: relative;">
              {% csrf_token %}
              <div class="mui-input-wrapper" style="display: flex; flex-direction: column; margin-bottom: 0;">
                <input 
                  type="email" 
                  id="email" 
                  name="email"
                  class="mui-input-contained"
                  style="display: flex; flex-direction: column;"
                  required
                  placeholder=" "
                  autofocus 
                  value="{{ email|default:'' }}"
                />
                <label for="email" class="mui-input-label">Email Address</label>
              </div>
              <button
                type="submit"
                class="mui-btn-contained"
                style="max-width: 280px; width: 100%; margin: 0 auto;"
              >
                Continue
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
