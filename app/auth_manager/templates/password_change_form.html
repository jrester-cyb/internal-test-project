<script>
    const VALID_PASSWORD_SPECIAL_CHARS_RE = /[!@#$%^&;*(),.?":{}|<>]/;
    function setCriteriaIcon(id, valid) {
        var icon = document.querySelector('#' + id + ' .criteria-icon');
        if (icon) {
            icon.innerHTML = valid ? '&#10003;' : '&#x2716;';
        }
    }
    function checkPasswordCriteria(pw, pw2) {
        var validLength = pw.length >= 12;
        var validUpper = /[A-Z]/.test(pw);
        var validLower = /[a-z]/.test(pw);
        var validNumber = /\d/.test(pw);
        var validSpecial = VALID_PASSWORD_SPECIAL_CHARS_RE.test(pw);
        var validMatch = pw && pw2 && pw === pw2;
        document.getElementById('criteria-length').className = validLength ? 'criteria-valid' : 'criteria-invalid';
        document.getElementById('criteria-upper').className = validUpper ? 'criteria-valid' : 'criteria-invalid';
        document.getElementById('criteria-lower').className = validLower ? 'criteria-valid' : 'criteria-invalid';
        document.getElementById('criteria-number').className = validNumber ? 'criteria-valid' : 'criteria-invalid';
        document.getElementById('criteria-special').className = validSpecial ? 'criteria-valid' : 'criteria-invalid';
        document.getElementById('criteria-match').className = validMatch ? 'criteria-valid' : 'criteria-invalid';
        setCriteriaIcon('criteria-length', validLength);
        setCriteriaIcon('criteria-upper', validUpper);
        setCriteriaIcon('criteria-lower', validLower);
        setCriteriaIcon('criteria-number', validNumber);
        setCriteriaIcon('criteria-special', validSpecial);
        setCriteriaIcon('criteria-match', validMatch);
    }

    document.addEventListener('DOMContentLoaded', function () {
        var pwInput = document.getElementById('new_password1');
        var pw2Input = document.getElementById('new_password2');
        var form = pwInput ? pwInput.form : null;
        function updateCriteria() {
            checkPasswordCriteria(pwInput.value, pw2Input.value);
        }
        if (pwInput && pw2Input && form) {
            pwInput.addEventListener('input', updateCriteria);
            pw2Input.addEventListener('input', updateCriteria);
            updateCriteria();
            form.addEventListener('submit', function (e) {
                var validLength = pwInput.value.length >= 12;
                var validUpper = /[A-Z]/.test(pwInput.value);
                var validLower = /[a-z]/.test(pwInput.value);
                var validNumber = /\d/.test(pwInput.value);
                var validSpecial = VALID_PASSWORD_SPECIAL_CHARS_RE.test(pwInput.value);
                var validMatch = pwInput.value && pw2Input.value && pwInput.value === pw2Input.value;
                if (!(validLength && validUpper && validLower && validNumber && validSpecial && validMatch)) {
                    e.preventDefault();
                }
            });
        }
    });
</script>
<style>
    .criteria-valid {
        color: #388e3c;
    }

    .criteria-invalid {
        color: #d32f2f;
    }

    #criteria-list {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .criteria-icon {
        display: inline-block;
        width: 1em;
        text-align: center;
        font-size: 0.95em;
        margin-right: 0.35em;
        vertical-align: middle;
    }
</style>
<div style="display: flex; justify-content: center; flex-direction: column; margin-top: 1.5em; position: relative;">
    <div id="password-criteria" style="border-radius: 6px; padding: 1em 1.5em; margin-bottom: 1.5em; text-align: left;">
        <strong>Password must contain:</strong>
        <ul id="criteria-list"
            style="margin: 0.5em 0 0 0; padding: 0; font-size: 0.98em; color: #333; list-style: none;">
            <li id="criteria-length" class="criteria-invalid"><span class="criteria-icon">&#10060;</span> At least 12
                characters</li>
            <li id="criteria-upper" class="criteria-invalid"><span class="criteria-icon">&#10060;</span> At least one
                uppercase letter</li>
            <li id="criteria-lower" class="criteria-invalid"><span class="criteria-icon">&#10060;</span> At least one
                lowercase letter</li>
            <li id="criteria-number" class="criteria-invalid"><span class="criteria-icon">&#10060;</span> At least one
                number</li>
            <li id="criteria-special" class="criteria-invalid"><span class="criteria-icon">&#10060;</span> At least one
                special character (e.g. !@#$%^&amp;*)</li>
            <li id="criteria-match" class="criteria-invalid"><span class="criteria-icon">&#10060;</span> Passwords match
            </li>
        </ul>
    </div>
</div>
<input type="hidden" name="id" value="{{user.id}}" />
<div class="mui-input-wrapper" style="display: flex; flex-direction: column; margin-bottom: 0;">
    <input type="email" id="email" name="email" class="mui-input-contained"
        style="display: flex; flex-direction: column;" required placeholder=" " value="{{ user.email|default:'' }}"
        readonly />
    <label for="email" class="mui-input-label">Email Address</label>
</div>
<div class="mui-input-wrapper" style="display: flex; flex-direction: column; margin-bottom: 0;">
    <input type="password" id="new_password1" name="new_password1" class="mui-input-contained"
        style="display: flex; flex-direction: column;" required autofocus placeholder=" "
        value="{{ request.POST.new_password1|default:'' }}" />
    <label for="new_password1" class="mui-input-label">New Password</label>
</div>
<div class="mui-input-wrapper" style="display: flex; flex-direction: column; margin-bottom: 0;">
    <input type="password" id="new_password2" name="new_password2" class="mui-input-contained"
        style="display: flex; flex-direction: column;" required placeholder=" "
        value="{{ request.POST.new_password2|default:'' }}" />
    <label for="new_password2" class="mui-input-label">Confirm Password</label>
</div>
