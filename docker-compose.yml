version: '3.8'
services:
  db:
    image: 151885604979.dkr.ecr.us-east-1.amazonaws.com/cybiricalubuntu_postgres:17.7
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Resource limits matching AWS RDS t3.micro instance
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
  redis:
    image: 151885604979.dkr.ecr.us-east-1.amazonaws.com/cybiricalubuntu_redis:7.4.7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  web:
    build: .
    command: gunicorn app.wsgi:application --bind 0.0.0.0:80
    volumes:
      - .:/app
    expose:
      - "80"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      localstack:
        condition: service_healthy
    environment:
      - DJANGO_DB_HOST=db
      - DJANGO_DB_NAME=mydb
      - DJANGO_DB_USER=myuser
      - DJANGO_DB_PASSWORD=mypassword
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_KMS_ENDPOINT_URL=http://localstack:4566
      - AWS_KMS_KEY_ID=alias/mfa-key
      - AWS_S3_ENDPOINT_URL=http://localstack:4566
  celery:
    build: .
    command: celery -A app worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - DJANGO_DB_HOST=db
      - DJANGO_DB_NAME=mydb
      - DJANGO_DB_USER=myuser
      - DJANGO_DB_PASSWORD=mypassword
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_KMS_ENDPOINT_URL=http://localstack:4566
      - AWS_KMS_KEY_ID=alias/mfa-key
      - AWS_S3_ENDPOINT_URL=http://localstack:4566
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - "5173"
    environment:
      - VITE_API_URL=http://localhost/api
    depends_on:
      - web
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - frontend
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,kms
      - DEBUG=1
      - PERSISTENCE=1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  localstack_data:
